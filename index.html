<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
    <link rel="icon" type="image/jpeg" href="avatar.jpg" />
    
    <!-- Meta Tags SEO & Social Media (Idênticas às originais) -->
    <meta name="title" content="Amanda Araújo" />
    <meta name="description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.suportee.online/pilates" />
    <meta property="og:title" content="Amanda Araújo" />
    <meta property="og:site_name" content="Amanda Araújo" />

    <meta property="og:image" itemprop="image" content="https://i.ibb.co/Dgv76BmS/27a17042c125806259ee381d64441989.jpg" />
    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:title" content="Amanda Araújo" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Tracking (Insira suas tags de rastreamento aqui, ex: Meta Pixel, Google Analytics, etc.) -->
</head>
<body>
    <div id="chat-container">
        <!-- Cabeçalho do Chat -->
        <header id="chat-header">
            <div class="header-profile">
                <div class="avatar-container">
                    <img src="avatar.jpg" alt="Amanda Araujo" id="header-avatar">
                    <span class="status-dot"></span>
                </div>
                <div class="profile-info">
                    <h1 id="header-title">Amanda Araújo</h1>
                    <span id="header-status">Online</span>
                </div>
            </div>
        </header>

        <!-- Corpo do Chat (Onde as mensagens rolam) -->
        <main id="chat-body">
            <div id="messages-container">
                <!-- As mensagens serão inseridas dinamicamente pelo JavaScript -->
            </div>
            
            <!-- Indicador de Digitação (Typing Indicator) -->
            <div id="typing-indicator" class="chat-bubble-container bot-message-container hidden">
                <div class="avatar-wrapper">
                    <img src="avatar.jpg" class="chat-avatar" alt="Avatar">
                </div>
                <div class="typing-bubble">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </main>

        <!-- Rodapé do Chat (Escolhas e Inputs) -->
        <footer id="chat-footer">
            <div id="input-container">
                <!-- Botões de escolha e inputs numéricos aparecerão aqui -->
            </div>
        </footer>
    </div>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
